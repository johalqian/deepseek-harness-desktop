<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
    <title>DeepSeek Harness Desktop</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #10151c;
        --panel: #161d26;
        --line: #2c3744;
        --text: #edf3f8;
        --muted: #8fa0b1;
        --blue: #78aee8;
        --amber: #e3b864;
        --danger: #ee8e86;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--ink);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      }
      main { width: min(620px, calc(100vw - 72px)); }
      .eyebrow {
        margin: 0 0 18px;
        color: var(--muted);
        font: 600 11px/1.2 ui-monospace, "SFMono-Regular", Menlo, monospace;
        letter-spacing: .16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-size: clamp(34px, 5vw, 56px);
        font-weight: 590;
        line-height: 1.02;
        letter-spacing: -.045em;
      }
      .copy {
        max-width: 500px;
        margin: 22px 0 34px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
      }
      .rail {
        position: relative;
        height: 2px;
        overflow: hidden;
        background: var(--line);
      }
      .rail::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 32%;
        background: linear-gradient(90deg, transparent, var(--blue));
        animation: travel 1.4s cubic-bezier(.4, 0, .2, 1) infinite;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        margin-top: 13px;
        color: var(--muted);
        font: 11px/1.4 ui-monospace, "SFMono-Regular", Menlo, monospace;
      }
      .error .rail { background: color-mix(in srgb, var(--danger) 35%, var(--line)); }
      .error .rail::after { display: none; }
      .error .eyebrow { color: var(--danger); }
      .detail {
        display: none;
        max-height: 150px;
        margin: 24px 0 0;
        padding: 15px 17px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: #c6d1dc;
        font: 12px/1.55 ui-monospace, "SFMono-Regular", Menlo, monospace;
        white-space: pre-wrap;
      }
      .error .detail { display: block; }
      button {
        display: none;
        margin-top: 22px;
        padding: 10px 15px;
        border: 1px solid #587da4;
        border-radius: 7px;
        background: #1b2b3c;
        color: var(--text);
        font: 600 13px/1 -apple-system, BlinkMacSystemFont, sans-serif;
        cursor: pointer;
      }
      button:hover { background: #21364b; }
      button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
      .error button { display: inline-block; }
      @keyframes travel { from { transform: translateX(-110%); } to { transform: translateX(420%); } }
      @media (prefers-reduced-motion: reduce) { .rail::after { animation: none; left: 34%; } }
    </style>
  </head>
  <body>
    <main id="surface">
      <p class="eyebrow" id="eyebrow">Local agent runtime</p>
      <h1 id="title">正在启动工作台</h1>
      <p class="copy" id="copy">桌面端正在准备本地 Harness、会话存储和工作区连接。完成后会自动进入，不需要手动打开浏览器。</p>
      <div class="rail" aria-hidden="true"></div>
      <div class="meta"><span>LOOPBACK ONLY</span><span>AUTO PORT</span></div>
      <pre class="detail" id="detail"></pre>
      <button type="button" id="restart">重新启动 Harness</button>
    </main>
    <script>
      const params = new URLSearchParams(location.search)
      const state = params.get('state') || 'starting'
      if (state === 'error') {
        document.querySelector('#surface').classList.add('error')
        document.querySelector('#eyebrow').textContent = 'Harness stopped'
        document.querySelector('#title').textContent = '本地服务没有启动'
        document.querySelector('#copy').textContent = '查看下面的最后一条运行信息。修正问题后可以直接重新启动。'
        document.querySelector('#detail').textContent = params.get('detail') || '没有收到更多错误信息。'
      }
      document.querySelector('#restart').addEventListener('click', () => {
        location.href = 'dsh-desktop://restart'
      })
    </script>
  </body>
</html>
